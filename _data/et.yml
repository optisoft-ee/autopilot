  title: "Uus arvuti on<br>karbist võttes<br>kohe tööks valmis."
  lead: "Uus töötaja saab arvuti kätte, logib oma tööpostiga sisse ja vajalikud programmid ning seaded tulevad ise peale. IT-tehnik ei pea iga masinat eraldi ette valmistama."
  cta: "Küsi konsultatsiooni"
  secondary: "Mis muutub?"
  under: "Kasutame Microsoft Intune’i, Windows Autopiloti ja Apple Business Manageri."
