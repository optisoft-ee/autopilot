security:
  eyebrow: "Turvalisus"
  title: "Sinu keskkond. Kontrollitud ligipääs."
  lead: "Seadmete haldamiseks vajame ligipääsu sinu Microsoft 365 keskkonnale. Kasutame ainult tööks vajalikke õigusi ning kõik tehtud muudatused on jälgitavad."
  items:
    - title: "Ainult vajalikud õigused"
      text: "Kasutame seadmehalduseks vajalikke administraatorirolle, näiteks Intune’i administraatori rolli. Väldime põhjendamatult ulatuslikke õigusi."
    - title: "Piiratud ligipääs"
      text: "Võimaluse korral kasutame ajaliselt piiratud ligipääsu (GDAP või Entra PIM). Õigused antakse vastavalt töö vajadusele."
    - title: "Jälgitavad muudatused"
      text: "Haldustoimingud on jälgitavad Intune’i auditilogis. Olulisemad seadistusmuudatused dokumenteerime eraldi muudatuste logis."
    - title: "Sinu keskkond jääb sulle"
      text: "Lepingu lõppedes eemaldatakse meie ligipääsud. Loodud profiilid, reeglid ja seadistused jäävad sinu Microsoft 365 keskkonda."
  fine: "Me ei vaja seadmete haldamiseks ligipääsu töötajate kirjadele ega failide sisule. Meie töö piirdub kokkulepitud seadmehalduse ülesannetega."

