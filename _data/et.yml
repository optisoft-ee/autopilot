  title: "Mida 1Day sinu eest teeb"
  lead: "Intune ja Autopilot sisalduvad paljudes Microsoft 365 pakettides. 1Day seadistab need sinu ettevõtte jaoks ja hoiab seadistuse edaspidi töökorras."
  parts:
