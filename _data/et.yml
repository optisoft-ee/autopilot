        - "Profiilid rollide kaupa: programmid, turvaseaded ja vastavusreeglid"
        - "Piloot 2–3 töötajaga ja mõõdetud enne–pärast tulemus"
    - title: "Pidev haldus"
      tag: "Kuutasu seadme kohta"
      items:
        - "Profiilide ja reeglite hooldus, kui programmid või rollid muutuvad"
        - "Windowsi ja rakenduste uuenduste kontroll enne kasutajateni jõudmist"
        - "Seadmete vastavuse jälgimine ja kõrvalekalletest teavitamine"
        - "Ebaõnnestunud seadistuse parandamine, kui viga on profiilis või reeglis"
