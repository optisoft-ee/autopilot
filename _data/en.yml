benefits:
  eyebrow: "What you get"
  title: "Employees can start work right away. <br>Your IT technician doesn’t have to deal with each computer separately."
  cards:
    - title: "IT has time for other things"
      text: "Preparing computers no longer takes up long working days for your technician. They check that the setup succeeded and can focus on other tasks."
    - title: "Ten computers or a hundred – the workload stays the same"
      text: "With manual setup, every new computer means extra work for the technician. Once the profiles are in place, the workload doesn’t grow at the same pace as the number of devices."
    - title: "Wipe a leaver’s computer with one command"
      text: "When someone leaves, we send their computer a wipe command. The next time the device connects to the network, it resets automatically and is prepared for a new user."

