start:
  eyebrow: "Getting started"
  title: "What we need from you and when you see results"
  you_label: "You"
  get_label: "Result"
  steps:
    - title: "Conversation"
      time: "30 min"
      you: "Tell us how many devices you have and which Microsoft 365 plan you use."
      get: "An assessment of whether 1Day fits, and a quote."
    - title: "Preparation"
      time: "1–2 weeks"
      you: "Grant limited admin rights (see Security) and a list of the apps you use."
      get: "Intune profiles for the roles in your company."
    - title: "Pilot"
      time: "1–2 weeks"
      you: "Pick 2–3 employees who get a new or reset computer."
      get: "Measured before–after results in your company."
    - title: "Ongoing management"
      time: "Ongoing"
      you: "Order computers shipped straight to employees."
      get: "New devices set themselves up. We keep profiles, policies and updates in order."

security:
  eyebrow: "Security"
  title: "Your environment. Controlled access."
  lead: "To manage your devices, we need access to your Microsoft 365 environment. We use only the rights the work requires, and every change is traceable."
  items:
    - title: "Only the rights needed"
      text: "We use the admin roles device management requires, such as the Intune Administrator role. We avoid unnecessarily broad rights."
    - title: "Limited access"
      text: "Where possible, we use time-limited access (GDAP or Entra PIM). Rights are granted as the work requires."
    - title: "Traceable changes"
      text: "Admin actions are traceable in the Intune audit log. We also document significant configuration changes in a separate change log."
    - title: "Your environment stays yours"
      text: "When the contract ends, our access is removed. The profiles, policies and settings we created stay in your Microsoft 365 environment."
  fine: "We don’t need access to employees’ email or file contents to manage devices. Our work is limited to the agreed device management tasks."

pricing:
  eyebrow: "Pricing"
  title: "The price has two parts"
  lead: "Initial setup is a one-off. Ongoing management is a monthly fee based on the number of devices."
  lead_noprice: "We’ll give you the exact figure after our first conversation."
  from: "from"
  per_device: "device / month"
  min: "Minimum monthly fee"
  vat: "Prices exclude VAT."
  items:
    - key: "setup"
      title: "Initial setup"
      text: "Environment review, building Autopilot and the profiles, and the pilot. The price depends on the number of apps and roles."
    - key: "device"
      title: "Ongoing management"
      text: "Same price for Windows, Mac, iPad and phones. Covers profile maintenance, update checks, compliance monitoring and fixing setup errors."
    - title: "Licences separate"
      text: "You need a Microsoft 365 plan with Intune, e.g. Business Premium or E3/E5. If you don’t have one, we’ll help you choose."
    - title: "Extra work priced up front"
      text: "For example adding a new app or a larger change. We agree the price before the work starts."

