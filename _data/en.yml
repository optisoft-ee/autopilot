  facts:
    - k: "Sample"
      v: "81 computers"
    - k: "Organisation"
      v: "Large enterprise"
    - k: "Comparison"
      v: "Manual setup by a technician vs Autopilot"
  before: "Manual"
  after: "With Autopilot"
  rows:
    - title: "Computer setup, start to finish"
      text: "Until the computer is ready for work. Most of this time the computer works on its own."
