process:
  eyebrow: "How it works"
  title: "Four steps"
  steps:
    - title: "Get to know"
      text: "We look at how computers reach your employees today and where your technician’s time goes."
    - title: "Set up"
      text: "In Intune, we set up the apps, security settings, updates and policies needed for different roles."
    - title: "Pilot"
      text: "We start with a few devices and compare how much time setup took before and after."
    - title: "Keep it running"
      text: "If the pilot is successful, we roll the solution out to all devices and keep the profiles up to date from then on."
  callout_title: "Why we offer maintenance for a monthly fee"
  callout_text: "Automation follows the settings defined in the profile. If the profile contains an error, it can reach every computer. That’s why we don’t stop at a one-off setup: we continuously monitor and update your profiles and policies."

pricing:
  - eyebrow: "Who it’s for"
    title: "Companies with 10–500 employees"
    text: "DayOne is especially suited to companies where devices are managed by an external IT partner or a small in-house IT team, and company data is kept on computers, iPads or phones."
  - eyebrow: "Pricing"
    title: "Fixed monthly fee per device"
    text: "This way your IT costs are known in advance. The invoice depends on the number of devices, not on technician hours. We’ll prepare an exact quote after our first conversation."
  - eyebrow: "What you need"
    title: "Microsoft 365 with Intune"
    text: "For example Business Premium or E3/E5. If you don’t have a suitable plan yet, we’ll help you choose one."

contact:
  eyebrow: "Contact"
  title: "Let’s talk about how we can help."
  lead: "Write us a few lines: how many people work at your company, which devices you use and which Microsoft 365 plan you have. Then we’ll arrange a half-hour call to review your current setup process and the time it takes."
  mail_label: "Write to us"
  mail_cta: "Ask for a consultation →"
  fine: "We only use the details in your email to contact you."

