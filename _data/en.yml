start:
  eyebrow: "Getting started"
  title: "What we need from you and when you see results"
  you_label: "You"
  get_label: "Result"
  steps:
    - title: "Conversation"
      time: "30 min"
      you: "Tell us how many devices you have and which Microsoft 365 plan you use."
      get: "An assessment of whether DayOne fits, and a quote."
    - title: "Preparation"
      time: "1–2 weeks"
      you: "Give us admin access and a list of the apps you use."
      get: "Intune profiles for the roles in your company."
    - title: "Pilot"
      time: "1–2 weeks"
      you: "Pick 2–3 employees who get a new or reset computer."
      get: "Measured before–after results in your company."
    - title: "Everyday use"
      time: "Ongoing"
      you: "Order computers shipped straight to employees."
      get: "New devices set themselves up; we keep the profiles in order."

pricing:
  eyebrow: "Pricing"
  title: "How the price is built"
  lead: "The price depends on the number of devices, not on technician hours. We’ll give you the exact figure after our first conversation."
  items:
    - title: "Monthly fee per device"
      text: "Same price for Windows, Mac, iPad and phones. Covers setup, updates, security policies and profile maintenance."
    - title: "One-off setup fee"
      text: "A review of your Microsoft 365 environment and building the Intune profiles. Depends on the number of apps and roles."
    - title: "Licences separate"
      text: "You need a Microsoft 365 plan with Intune, e.g. Business Premium or E3/E5. If you don’t have one, we’ll help you choose."
    - title: "Extra work priced up front"
      text: "For example adding a new app or a larger change. We agree the price before the work, not on the invoice."

contact:
