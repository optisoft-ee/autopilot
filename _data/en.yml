process:
  eyebrow: "How it works"
  title: "Four steps"
  steps:
    - title: "Get to know you"
      text: "We look at how computers reach your employees today and where your technician’s time goes."
    - title: "Set up"
      text: "We configure Intune profiles for different roles: apps, security settings, updates and policies."
    - title: "Pilot"
      text: "We start with a few devices and measure how long things took before and after."
    - title: "Keep it running"
      text: "Once the pilot works, we roll it out to all your devices and keep the profiles up to date."
  callout_title: "Why maintenance is a monthly service"
  callout_text: "Automation does exactly what the profile says. If the profile has a mistake, it reaches every computer. That’s why we don’t stop at a one-off setup: we keep an eye on your profiles and policies all the time."

pricing:
  - eyebrow: "Who it’s for"
    title: "Companies with 10–500 employees"
    text: "Especially if an external IT partner or a small in-house team looks after your computers, and company data lives on your employees’ computers, iPads or phones."
  - eyebrow: "Pricing"
    title: "Fixed monthly fee per device"
    text: "Your IT costs are known in advance. The bill depends on the number of devices, not on how many hours the technician worked that month. We’ll send a quote after our first conversation."
  - eyebrow: "What you need"
    title: "Microsoft 365 with Intune"
    text: "For example Business Premium or E3/E5. If you don’t have it yet, we’ll help you pick the right plan."

contact:
  eyebrow: "Contact"
  title: "Let’s talk about how we can help."
  lead: "Drop us a few lines: how many people work at your company, what devices you use and which Microsoft 365 plan you have. Then we’ll set up a 30-minute call to look at how much time computer setup takes you today."
  mail_label: "Write to us"
  mail_cta: "Book a consultation →"
