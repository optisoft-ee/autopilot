change:
  eyebrow: "What changes"
  title: "Some work disappears, some is automated, some stays"
  lead: "Automation doesn’t do everything. This is how the work is split once DayOne is in place."
  columns:
    - title: "Disappears"
      items:
        - title: "Setup at the technician’s desk"
          text: "The computer ships from the vendor straight to the employee."
        - title: "Installing apps by hand"
          text: "Nothing needs installing on each computer separately."
        - title: "Settings that differ per computer"
          text: "Everyone gets the same profile."
    - title: "Automated"
      items:
        - title: "Apps, security settings and updates"
          text: "Installed at sign-in, following the profile."
        - title: "Compliance checks"
          text: "Deviations are visible right away."
        - title: "Wiping a leaver’s computer"
          text: "One command, the rest happens automatically."
    - title: "Stays with people"
      items:
        - title: "Checking the setup"
          text: "About 15 minutes for the whole fleet."
        - title: "Maintaining profiles"
          text: "We keep profiles and policies up to date."
        - title: "User support and exceptions"
          text: "Stay with your IT or IT partner."
  gains_label: "What you get:"
  gains: ["Faster onboarding", "A consistent device fleet", "Fewer tickets after setup", "Predictable cost"]

