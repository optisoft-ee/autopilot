  title: "New hires start working <br>on day one."
  lead: "1Day sets up Intune and Windows Autopilot in your Microsoft 365 environment and keeps managing them. Computers ship from the vendor straight to the employee. Apps, security settings and the work profile install automatically at sign-in, so IT doesn’t need to prepare devices by hand."
  cta: "Check if it pays off"
  secondary: "What 1Day does for you"
  steps:
    - title: "Open your device"
    - title: "Sign in"
    - title: "Start working"
  platforms: ["Windows", "macOS", "mobile devices"]
  proof_label: "Pilot with 81 computers"
  proof_before: "Manual process: 8 days (median)"
  proof_after: "With Autopilot: ready ~30 min after sign-in"
  proof_note: "Process time from helpdesk data, setup time from the pilot"

service:
  eyebrow: "Service"
  title: "What 1Day does for you"
  lead: "Intune and Autopilot come with many Microsoft 365 plans. 1Day sets them up for your company and keeps the setup working from then on."
  parts:
    - title: "Initial setup"
      tag: "One-off"
      items:
        - "Review of your Microsoft 365 and Intune environment"
        - "Autopilot and device enrolment setup"
        - "Profiles per role: apps, security settings and compliance policies"
        - "Pilot with 2–3 employees and a measured before–after result"
    - title: "Ongoing management"
      tag: "Monthly fee per device"
      items:
        - "Maintaining profiles and policies as apps or roles change"
        - "Checking Windows and app updates before they reach users"
        - "Monitoring device compliance and flagging deviations"
        - "Fixing failed setups when the cause is in a profile or policy"
        - "Change log: every change is documented"
  boundary_label: "Stays with you:"
  boundary: "user support, hardware and exceptions. If you have an IT partner, we work with them."

results:
  eyebrow: "Evidence"
  title: "What we measured in the pilot"
  facts:
    - k: "Sample"
      v: "81 computers"
    - k: "Client"
      v: "Elenger"
    - k: "Manual process"
      v: "8 days (median)"
    - k: "Comparison"
      v: "Manual setup by a technician vs Autopilot"
  before: "Manual"
  after: "With Autopilot"
  rows:
    - title: "Total setup time"
      text: "From unboxing to a computer ready for work. Most of this time the computer works on its own and nobody needs to be there."
      before: "2–4 h"
      after: "~30 min"
    - title: "Active technician time"
      text: "With manual setup, the technician prepared every computer separately. With Autopilot, the technician doesn’t touch the computer: checking the setup took about 15 minutes for the whole fleet of 81 computers."
      before: "~2 h"
      before_note: "per computer"
      after: "~15 min"
      after_note: "whole fleet"
    - title: "Wiping a leaver’s computer"
      text: "When an employee leaves and the computer goes to a new user."
      before: "1–2 h"
      after: "~15 min"
  note: "These are two different measures: total time shows when the employee can start, and active technician time shows how much IT time it takes. The manual process time is based on an analysis of helpdesk tickets. The results are indicative. In your company, we first measure the current situation."

change:
  eyebrow: "What changes"
  title: "How the work is split after rollout"
  lead: "Below you can see which work disappears, what happens automatically and what 1Day does."
  columns:
    - title: "Disappears"
      items:
        - title: "Setup at the technician’s desk"
          text: "The computer ships from the vendor straight to the employee."
        - title: "Installing apps by hand"
          text: "Nothing needs installing on each computer separately."
        - title: "Settings that differ per computer"
          text: "Everyone gets the same profile."
    - title: "Automated"
      items:
        - title: "Apps, security settings and updates"
          text: "Installed at sign-in, following the profile."
        - title: "Compliance checks"
          text: "Deviations are visible right away."
        - title: "Wiping a leaver’s computer"
          text: "One command, the rest happens automatically."
    - title: "Done by 1Day"
      items:
        - title: "Maintaining profiles and policies"
          text: "We change the setup as apps or roles change."
        - title: "Monitoring updates and compliance"
          text: "We monitor device status and deal with deviations."
        - title: "Fixing setup errors"
          text: "User support and exceptions stay with your IT or IT partner."
  gains_label: "What you get:"
  gains: ["Faster onboarding", "A consistent device fleet", "Fewer tickets after setup", "Predictable cost"]

