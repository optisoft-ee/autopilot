benefits:
  eyebrow: "What you get"
  title: "Employees can start work right away.<br>IT doesn’t have to step in."
  cards:
    - title: "IT gets time back for other work"
      text: "Preparing computers no longer eats up your technician’s days. They check that the setup went through and can spend the rest of their time on other work."
    - title: "10 computers or 100, same amount of work"
      text: "With manual setup, every new computer means a couple of hours of work. Once the profile is in place, the workload doesn’t depend on how many devices you add."
    - title: "Wipe a leaver’s computer in one click"
      text: "When someone leaves, we send their computer a wipe command. The next time it goes online, it resets itself and is ready for a new user."

